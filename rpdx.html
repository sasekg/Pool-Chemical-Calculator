<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pool Chemical Calculator</title>
  <style>
    :root {
      --rootpdx-blue: #1683ff;
      --rootpdx-black: #030609;
      --rootpdx-dim: #0c61bd;
      --rootpdx-trim: #4d4d4d;

      /* color: var(--rootpdx-blue);
      background-color: var(--rootpdx-black); */
      font-family:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      /* color-scheme: dark; */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    input[type="number"] {
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      display: flex;
      justify-content: center;

      form {
        input {
          width: 100%;
          text-align: center;
          padding: 8px 0px 10px 0px;
        }

        .row {
          display: grid;
          grid-template-columns: 150px repeat(2, 60px) 60px;
          gap: 10px;
          margin: 5px auto;


          .field {
            position: relative;

            .unit {
              display: block;
              width: 100%;
              text-align: center;
              font-size: x-small;
              position: absolute;
              bottom: 3px;
              left: 0px;
            }
          }

          &.volume {
            margin: 20px auto;
            text-align: right;
          }

          &.heading {
            text-align: center;
            align-self: center;
          }

          .row-label {

            .test-name {
              font-weight: bold;
              position: relative;
              top: 3px;
            }

            .chemical-name {
              font-size: small;
              position: relative;
              top: -1px;
            }
          }

          label {
            align-self: center;
          }

          output {
            align-self: center;
            text-align: right;
          }
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="calculator">
      <div class="row volume">
        <span></span>
        <label for="gallons">Gallons</label>
        <input id="gallons"
               name="gallons"
               type="number"
               min="1"
               step="any"
               required>
      </div>
      <div class="row heading">
        <span></span>
        <span>Test</span>
        <span>Set</span>
        <span>Add</span>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="ta-label">
        <div class="row-label">
          <span id="ta-label"
                class="test-name">Total Alkalinity</span>
          <span class="chemical-name">Sodium Bicarbonate</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-test">Test (ppm)</label>
          <input id="ta-test"
                 name="ta-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-target">Target (ppm)</label>
          <input id="ta-target"
                 name="ta_target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <output id="ta-result"
                  for="gallons ta-test ta-target factor"
                  aria-label="Sodium bicarbonate result"
                  aria-live="polite">
            <span id="ta-result-value"
                  class="unit"></span>                  
            <span id="ta-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
    </form>
  </main>
  <script src="pool-api.js"></script>
  <script>
    const form = document.querySelector('#calculator');
    const gallons = document.querySelector('#gallons');

    function calc_us_ppm(test, target, gal, active_pct, mass_ratio) {
      const response = ROOTPDX_POOL_API.calculate_us_product_dose_for_target_ppm.request({
        test_ppm: Number(test),
        target_ppm: Number(target),
        pool_volume_us_gallons: Number(gal),
        active_ingredient_fraction: active_pct,
        mass_to_test_ratio: mass_ratio
      });

      if (response.ok) {
        return response.data.product_volume_us_fluid_ounces;
      } else {
        console.log(response);
      }
      return ROOTPDX_POOL_API.ERROR_STATUS;
    }

    function get_ta_html_elements() {
      return {
        test: document.querySelector('#ta-test'),
        target: document.querySelector('#ta-target'),
        result_value: document.querySelector('#ta-result-value'),
        result_unit: document.querySelector('#ta-result-unit')
      }
    }

    function calc_total_alkalinity() {
      if (!form.checkValidity()) {
        reset_total_alkalinity_result();
        console.log(form);
        return;
      }

      const ta_html = get_ta_html_elements();

      const result = calc_us_ppm(
        ta_html.test.value,
        ta_html.target.value,
        gallons.value,
        1,
        ROOTPDX_POOL_API.MASS_TO_TEST_RATIOS.sodium_bicarbonate_to_total_alkalinity
      );

      if (result == ROOTPDX_POOL_API.ERROR_STATUS) {
        return;
      }

      const oz = result.toLocaleString(undefined, { maximumFractionDigits: 0 })

      if (oz >= 64) {
        const lb = Number(oz / 16).toLocaleString(undefined, { 'maximumFractionDigits': 1 });
        ta_html.result_value.innerHTML = lb;
        ta_html.result_unit.innerHTML = "lb";
      } else {
        ta_html.result_value.innerHTML = oz;
        ta_html.result_unit.innerHTML= "oz";
      }
    }

    function calculate() {
      calc_total_alkalinity();
    }

    function reset_total_alkalinity_result() {
      const ta_html = get_ta_html_elements();
      ta_html.result_value.innerHTML = '';
      ta_html.result_unit.innerHTML = '';      
    }

    function reset_total_alkalinity() {
      const ta_html = get_ta_html_elements();
      ta_html.test.value = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.total_alkalinity.test_ppm;
      ta_html.target.value = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.total_alkalinity.target_ppm;
      reset_total_alkalinity_result();
    }

    function reset() {
      gallons.value = 10000;
      reset_total_alkalinity();
      calculate();
    }

    reset();


    form.addEventListener('input', calculate);
  </script>
</body>
</html>
