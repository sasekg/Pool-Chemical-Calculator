<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pool Chemical Calculator</title>
  <style>
    :root {
      --rootpdx-blue: #1683ff;
      --rootpdx-black: #030609;
      --rootpdx-dim: #0c61bd;
      --rootpdx-trim: #4d4d4d;

      /* color: var(--rootpdx-blue);
      background-color: var(--rootpdx-black); */
      font-family:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      /* color-scheme: dark; */
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      display: flex;
      justify-content: center;

      form {
        .row {
          display: grid;
          grid-template-columns: 150px repeat(2, 76px) 100px;
          gap: 10px;

          input {
            text-align: right;
          }

          &:first-child {
            margin: 20px auto;
            text-align: right;
          }

          &.heading {
            text-align: center;
          }

          output {
            align-self: center;
            text-align: right;
          }
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="calculator">
      <div class="row">
        <span></span>
        <label for="gallons">Gallons</label>
        <input id="gallons"
               name="gallons"
               type="number"
               min="1"
               step="any"
               required>
      </div>
      <div class="row heading">
        <span></span>
        <span>Test</span>
        <span>Set</span>
        <span>Add</span>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="ta-label">
        <div>
          <strong id="ta-label">Total Alkalinity</strong>
          <br>
          <small>Sodium Bicarbonate</small>
        </div>
        <label class="visually-hidden"
               for="ta-test">Test (ppm)</label>
        <input id="ta-test"
               name="ta-test"
               type="number"
               min="0"
               step="any"
               required>
        <label class="visually-hidden" for="target">Target (ppm)</label>
        <input id="ta-target"
               name="ta_target"
               type="number"
               min="0"
               step="any"
               required>
        <output id="ta-result"
                for="gallons ta-test ta-target factor"
                aria-label="Sodium bicarbonate result"
                aria-live="polite"></output>
      </div>
    </form>
  </main>
  <script src="pool-api.js"></script>
  <script>
    const form = document.querySelector('#calculator');
    const gallons = document.querySelector('#gallons');
    const ta_test = document.querySelector('#ta-test');
    const ta_target = document.querySelector('#ta-target');
    //const factor = document.querySelector('#factor');
    const ta_result = document.querySelector('#ta-result');

    //factor.value = ROOTPDX_POOL_API.effective_test_factors.sodium_bicarbonate_to_total_alkalinity;

    function calculate() {
      if (!form.checkValidity()) {
        ta_result.value = '';
        return;
      }

      const response = ROOTPDX_POOL_API.calculate_us_product_dose_for_target_ppm.request({
        test_ppm: Number(ta_test.value),
        target_ppm: Number(ta_target.value),
        pool_volume_us_gallons: Number(gallons.value),
        active_ingredient_fraction: 1,
        mass_to_test_ratio: ROOTPDX_POOL_API.MASS_TO_TEST_RATIOS.sodium_bicarbonate_to_total_alkalinity
      });

     ta_result.value = response.ok
        ? `${response.data.product_volume_us_fluid_ounces.toLocaleString(undefined, { maximumFractionDigits: 0 })} oz`
        : '';
    }

    function reset() {
      gallons.value = 10000;
      ta_test.value = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.total_alkalinity.test_ppm;
      ta_target.value = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.total_alkalinity.target_ppm;
      calculate();
    }

    reset();


    form.addEventListener('input', calculate);
  </script>
</body>
</html>
