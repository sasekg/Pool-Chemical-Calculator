<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pool Chemical Calculator</title>
  <style>
    :root {
      --rootpdx-blue: #1683ff;
      --rootpdx-black: #030609;
      --rootpdx-dim: #0c61bd;
      --rootpdx-trim: #4d4d4d;

      /* color: var(--rootpdx-blue);
      background-color: var(--rootpdx-black); */
      font-family:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      /* color-scheme: dark; */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    output,
    input[type="number"] {
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      display: flex;
      justify-content: center;

      form {

        input,
        output {
          width: 100%;
          height: 100%;
          display: block;
          text-align: center;
          padding: 8px 0px 10px 0px;
          border: 1px solid var(--rootpdx-trim);
        }

        .row {
          display: grid;
          grid-template-columns: 150px repeat(5, 60px);
          gap: 10px;
          margin-bottom: 5px;
          height: 40px;


          .field {
            position: relative;

            .unit {
              display: block;
              width: 100%;
              text-align: center;
              font-size: x-small;
              position: absolute;
              bottom: 3px;
              left: 0px;

              .symbol {
                font-size: .75em;
              }
            }
          }

          &.volume {
            margin: 20px auto;
            text-align: right;
          }

          &.heading {
            text-align: center;
            align-self: center;
            height: unset;

            .col-name,
            .col-symbol {
              display: block;
            }

            .active,
            .relative-mass {
              .col-name {
                font-size: small;
              }

              .col-symbol {
                font-size: x-small;
              }
            }
          }

          .row-label {
            span {
              display: block;
            }

            .test-name {
              position: relative;
              top: 3px;
            }

            .chemical-name {
              font-size: small;
            }
          }

          label {
            align-self: center;
          }
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="calculator">
      <div class="row volume">
        <span></span>
        <label for="gallons">Gallons</label>
        <input id="gallons"
               name="gallons"
               type="number"
               min="1"
               step="any"
               required>
      </div>
      <div class="row heading">
        <span></span>
        <span>Test</span>
        <span>Target</span>
        <span class="active"><span class="col-name">Active</span><span class="col-name">%</span><span class="col-symbol">0 to 100</span></span>
        <span class="relative-mass"><span class="col-name">Relative Mass</span><span class="col-symbol">0 to 1</span></span>
        <span>DO</span>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="ta-label">
        <div class="row-label">
          <span id="ta-label"
                class="test-name">Total Alkalinity</span>
          <span class="chemical-name">Sodium bicarbonate</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-test">Test (ppm)</label>
          <input id="ta-test"
                 name="ta-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-target">Target (ppm)</label>
          <input id="ta-target"
                 name="ta-target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field"> <label class="visually-hidden"
                 for="ta-active">Active Ingredient % 0 to 100</label>
          <input id="ta-active"
                 name="ta-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">%</span>
        </div>
        <div class="field"><label class="visually-hidden"
                 for="ta-relative-mass">Relative Mass 0.00 to 1.00</label>
          <input id="ta-relative-mass"
                 name="ta-relative-mass"
                 type="number"
                 min="0"
                 max="1"
                 step="any"
                 required>
          <span class="unit">M/H2O</span>
        </div>
        <div class="field">
          <output id="ta-result"
                  for="gallons ta-test ta-target factor"
                  aria-label="Sodium bicarbonate result"
                  aria-live="polite">
            <span id="ta-result-value"
                  class="result-value"></span>
            <span id="ta-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="ph-label">
        <div class="row-label">
          <span id="ph-label"
                class="test-name">pH</span>
          <span class="chemical-name">Muriatic acid</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-test">Test (pH)</label>
          <input id="ph-test"
                 name="ph-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">pH</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-target">Target (pH)</label>
          <input id="ph-target"
                 name="ph_target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">pH</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-active">Active Ingredient Fraction (%)</label>
          <input id="ph-active"
                 name="ph-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">hcl<span class="symbol">%</span></span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-total-alkalinity">Total Alkalinity value for Muriatic acid calculation</label>
          <input id="ph-total-alkalinity"
                 name="ph-total-alkalinity"
                 type="number"
                 min="0"
                 max="200"
                 step="any"
                 required>
          <span class="unit">TA ppm</span>
        </div>
        <div class="field">
          <output id="ph-result"
                  for="gallons ph-test ph-target factor"
                  aria-label="Muriatic acid result"
                  aria-live="polite">
            <span id="ph-result-value"
                  class="result-value"></span>
            <span id="ph-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="cl-label">
        <div class="row-label">
          <span id="cl-label"
                class="test-name">Free Chlorine</span>
          <span class="chemical-name">Cal-Hypo</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="cl-test">Test (ppm)</label>
          <input id="cl-test"
                 name="cl-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="cl-target">Target (ppm)</label>
          <input id="cl-target"
                 name="cl-target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field"> <label class="visually-hidden"
                 for="cl-active">Active Ingredient % 0 to 100</label>
          <input id="cl-active"
                 name="cl-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">%</span>
        </div>
        <div class="field"><label class="visually-hidden"
                 for="cl-relative-mass">Relative Mass 0.00 to 1.00</label>
          <input id="cl-relative-mass"
                 name="cl-relative-mass"
                 type="number"
                 min="0"
                 max="1"
                 step="any"
                 required>
          <span class="unit">M/H2O</span>
        </div>
        <div class="field">
          <output id="cl-result"
                  for="gallons cl-test cl-target factor"
                  aria-label="Sodium bicarbonate result"
                  aria-live="polite">
            <span id="cl-result-value"
                  class="result-value"></span>
            <span id="cl-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>      
    </form>
  </main>
  <script src="pool-api.js"></script>
  <script>
    const form = document.querySelector('#calculator');
    const gallons = document.querySelector('#gallons');

    function calc_us_ppm(test, target, gal, active_pct, mass_ratio) {
      const response = ROOTPDX_POOL_API.calculate_us_product_dose_for_target_ppm.request({
        test_ppm: Number(test),
        target_ppm: Number(target),
        pool_volume_us_gallons: Number(gal),
        active_ingredient_percent: Number(active_pct),
        relative_mass: mass_ratio
      });

      if (response.ok) {
        return response.data.product_volume_us_fluid_ounces;
      } else {
        console.log(response);
      }
      return ROOTPDX_POOL_API.ERROR_STATUS;
    }

    function calculate_us_muriatic_acid_dose_for_target_ph(test, target, gal, percent_hcl, ta) {
      const response = ROOTPDX_POOL_API.calculate_us_muriatic_acid_dose_for_target_ph.request({
        test_ph: Number(test),
        target_ph: Number(target),
        total_alkalinity_ppm: Number(ta),
        percent_hcl: Number(percent_hcl),
        pool_volume_us_gallons: Number(gal)
      });

      if (response.ok) {
        return response.data.muriatic_acid_volume_us_fluid_ounces;
      } else {
        console.log(response);
      }
      return ROOTPDX_POOL_API.ERROR_STATUS;      
    }

    function get_common_html_elements(pfx) {
      return {
        test: document.querySelector(`#${pfx}-test`),
        target: document.querySelector(`#${pfx}-target`),
        active: document.querySelector(`#${pfx}-active`),
        relative_mass: document.querySelector(`#${pfx}-relative-mass`),
        result_value: document.querySelector(`#${pfx}-result-value`),
        result_unit: document.querySelector(`#${pfx}-result-unit`)
      }
    }

    function get_ta_html_elements() {
      return get_common_html_elements('ta');
    }

    function get_ph_html_elements() {
      const o = get_common_html_elements('ph');
      o.total_alkalinity = document.querySelector("#ph-total-alkalinity");
      return o;
    }

    function get_cl_html_elements() {
      return get_common_html_elements('cl');
    }
    
    function format_oz(result) {
      const oz = Number(result).toFixed(2);
      const val_unit = {
        val: oz,
        unit: 'oz'
      }

      if (oz >= 64) {
        const lb = Number(oz / 16).toFixed(2);
        val_unit.val = lb;
        val_unit.unit = "lb";
      } 
      return val_unit;
    }

    function calc_total_alkalinity() {
      if (!form.checkValidity()) {
        reset_total_alkalinity_result();
        console.log(form);
        return;
      }

      const o = get_ta_html_elements();

      const result = calc_us_ppm(
        o.test.value,
        o.target.value,
        gallons.value,
        100,
        ROOTPDX_POOL_API.RELATIVE_MASSES.sodium_bicarbonate_to_total_alkalinity
      );

      console.log(result);
      if (result == ROOTPDX_POOL_API.ERROR_STATUS) {
        return;
      }

      const val_unit = format_oz(result);
      o.result_value.innerHTML = val_unit.val;
      o.result_unit.innerHTML = val_unit.unit;
    }

    function calc_free_chlorine() {
      if (!form.checkValidity()) {
        reset_cl_result();
        console.log(form);
        return;
      }

      const o = get_cl_html_elements();

      const result = calc_us_ppm(
        o.test.value,
        o.target.value,
        gallons.value,
        o.active.value,
        o.relative_mass.value
      );

      console.log(result);
      if (result == ROOTPDX_POOL_API.ERROR_STATUS) {
        return;
      }

      const val_unit = format_oz(result);
      o.result_value.innerHTML = val_unit.val;
      o.result_unit.innerHTML = val_unit.unit;
    }



    function calc_ph() {
      if (!form.checkValidity()) {
        reset_ph_result();
        console.log(form);
        return;
      }

      const o = get_ph_html_elements();

      const result = calculate_us_muriatic_acid_dose_for_target_ph(
        o.test.value,
        o.target.value,
        gallons.value,
        o.active.value,
        o.total_alkalinity.value
      );

      console.log(result);
      if (result == ROOTPDX_POOL_API.ERROR_STATUS) {
        return;
      }

      const val_unit = format_oz(result);
      o.result_value.innerHTML = val_unit.val;
      o.result_unit.innerHTML = val_unit.unit;      
    }

    function calculate() {
      calc_total_alkalinity();
      calc_ph();
      calc_cl();
    }

    function reset_total_alkalinity_result() {
      const o = get_ta_html_elements();
      o.result_value.innerHTML = '';
      o.result_unit.innerHTML = '';
    }

    function reset_total_alkalinity() {
      const o = get_ta_html_elements();
      const v = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.total_alkalinity;

      o.test.value = v.test_ppm;
      o.target.value = v.target_ppm;
      o.active.value = v.active_ingredient_percent.toLocaleString(undefined, { maximumFractionDigits: 1 });
      o.relative_mass.value = v.relative_mass.toLocaleString(undefined, { maximumFractionDigits: 4 });

      reset_total_alkalinity_result();
    }

    function reset_ph_result() {
      const html = get_ph_html_elements();
      html.result_value.innerHTML = '';
      html.result_unit.innerHTML = '';
    }

    function reset_cl_result() {
      const html = get_cl_html_elements();
      html.result_value.innerHTML = '';
      html.result_unit.innerHTML = '';
    }

    function reset_ph() {
      const o = get_ph_html_elements();
      const v = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.ph;

      o.test.value = v.test_ph;
      o.target.value = v.target_ph;
      o.active.value = v.percent_hcl;
      o.total_alkalinity.value = v.total_alkalinity_ppm;

      reset_ph_result();
    }

    function reset_cl() {
      const o = get_cl_html_elements();
      const v = ROOTPDX_POOL_API.FORM_INITIAL_VALUES.free_chlorine;

      o.test.value = v.test;
      o.target.value = v.target;
      o.active.value = v.active_ingredient_percent;
      o.relative_mass.value = v.relative_mass;

      reset_cl_result();
    }

    function reset() {
      gallons.value = 10000;
      reset_total_alkalinity();
      reset_ph();
      reset_cl();
      calculate();
    }

    reset();

    form.addEventListener('input', calculate);
  </script>
</body>
</html>
