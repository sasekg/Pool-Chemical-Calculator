<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pool Chemical Calculator</title>
  <style>
    :root {
      --rootpdx-blue: #1683ff;
      --rootpdx-black: #030609;
      --rootpdx-dim: #0c61bd;
      --rootpdx-trim: #4d4d4d;

      /* color: var(--rootpdx-blue);
      background-color: var(--rootpdx-black); */
      font-family:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      /* color-scheme: dark; */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    output,
    input[type="number"] {
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      display: flex;
      justify-content: center;

      form {

        input,
        output {
          width: 100%;
          height: 100%;
          display: block;
          text-align: center;
          padding: 8px 0px 10px 0px;
          font-size: 14px;
          border: 1px solid var(--rootpdx-trim);
        }

        .row {
          display: grid;
          grid-template-columns: 150px repeat(5, 60px);
          gap: 5px;
          margin-bottom: 5px;
          height: 40px;

          .field {
            position: relative;

            .unit {
              display: block;
              width: 100%;
              text-align: center;
              font-size: x-small;
              position: absolute;
              bottom: 3px;
              left: 0px;

              .symbol {
                font-size: 8px;
              }
            }
          }

          &.volume {
            margin: 20px auto;

            .volume-units-label {
              align-self: center;
              font-size: 15px;
            }
          }

          &.heading {
            text-align: center;
            align-self: center;
            height: unset;

            .col-name,
            .col-symbol {
              display: block;
            }

            .active,
            .relative-mass {
              .col-name {
                font-size: small;
              }

              .col-symbol {
                font-size: x-small;
              }
            }
          }

          .row-label {
            text-wrap: nowrap;
            position: relative;


            span {
              display: block;
            }

            .test-name {
              width: 100%;
              height: 100%;
              display: block;
              text-align: center;
              padding: 8px 0px 10px 0px;
              font-size: 14px;
            }

            .chemical-name {
              display: block;
              width: 100%;
              text-align: center;
              font-size: x-small;
              position: absolute;
              bottom: 3px;
              left: 0px;
            }
          }
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <form id="calculator">
      <div class="row volume">
        <span></span>
        <label class="visually-hidden"
               for="gallons">Gallons</label>
        <span class="volume-units-label">Gallons</span>
        <input id="gallons"
               name="gallons"
               type="number"
               min="1"
               step="any"
               required>
      </div>
      <div class="row heading">
        <span></span>
        <span>Test</span>
        <span>Target</span>
        <span class="active"><span class="col-name">Active</span><span class="col-name">%</span><span class="col-symbol">0 to 100</span></span>
        <span class="relative-mass"><span class="col-name">Relative Mass</span><span class="col-symbol">0 to 1</span></span>
        <span>DO</span>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="test-name chemical-name">
        <div class="row-label">
          <span id="ta-label"
                class="test-name">Total Alkalinity</span>
          <span class="chemical-name">[Sodium bicarbonate]</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-test">Test (ppm)</label>
          <input id="ta-test"
                 name="ta-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ta-target">Target (ppm)</label>
          <input id="ta-target"
                 name="ta-target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field"> <label class="visually-hidden"
                 for="ta-active">Active Ingredient % 0 to 100</label>
          <input id="ta-active"
                 name="ta-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">%</span>
        </div>
        <div class="field"><label class="visually-hidden"
                 for="ta-relative-mass">Relative Mass 0.00 to 1.00</label>
          <input id="ta-relative-mass"
                 name="ta-relative-mass"
                 type="number"
                 min="0"
                 max="1"
                 step="any"
                 required>
          <span class="unit">M/H2O</span>
        </div>
        <div class="field">
          <output id="ta-result"
                  for="gallons ta-test ta-target factor"
                  aria-label="Sodium bicarbonate result"
                  aria-live="polite">
            <span id="ta-result-value"
                  class="result-value"></span>
            <span id="ta-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="ph-label">
        <div class="row-label">
          <span id="ph-label"
                class="test-name">pH</span>
          <span class="chemical-name">[Muriatic acid]</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-test">Test (pH)</label>
          <input id="ph-test"
                 name="ph-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">pH</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-target">Target (pH)</label>
          <input id="ph-target"
                 name="ph_target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">pH</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-active">Active Ingredient Fraction (%)</label>
          <input id="ph-active"
                 name="ph-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">hcl<span class="symbol">%</span></span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="ph-total-alkalinity">Total Alkalinity value for Muriatic acid calculation</label>
          <input id="ph-total-alkalinity"
                 name="ph-total-alkalinity"
                 type="number"
                 min="0"
                 max="200"
                 step="any"
                 required>
          <span class="unit">TA ppm</span>
        </div>
        <div class="field">
          <output id="ph-result"
                  for="gallons ph-test ph-target factor"
                  aria-label="Muriatic acid result"
                  aria-live="polite">
            <span id="ph-result-value"
                  class="result-value"></span>
            <span id="ph-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
      <div class="row"
           role="group"
           aria-labelledby="cl-label">
        <div class="row-label">
          <span id="cl-label"
                class="test-name">Free Chlorine</span>
          <span class="chemical-name">[Cal-Hypo]</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="cl-test">Test (ppm)</label>
          <input id="cl-test"
                 name="cl-test"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field">
          <label class="visually-hidden"
                 for="cl-target">Target (ppm)</label>
          <input id="cl-target"
                 name="cl-target"
                 type="number"
                 min="0"
                 step="any"
                 required>
          <span class="unit">ppm</span>
        </div>
        <div class="field"> <label class="visually-hidden"
                 for="cl-active">Active Ingredient % 0 to 100</label>
          <input id="cl-active"
                 name="cl-active"
                 type="number"
                 min="0"
                 max="100"
                 step="any"
                 required>
          <span class="unit">%</span>
        </div>
        <div class="field"><label class="visually-hidden"
                 for="cl-relative-mass">Relative Mass 0.00 to 1.00</label>
          <input id="cl-relative-mass"
                 name="cl-relative-mass"
                 type="number"
                 min="0"
                 max="1"
                 step="any"
                 required>
          <span class="unit">M/H2O</span>
        </div>
        <div class="field">
          <output id="cl-result"
                  for="gallons cl-test cl-target factor"
                  aria-label="Sodium bicarbonate result"
                  aria-live="polite">
            <span id="cl-result-value"
                  class="result-value"></span>
            <span id="cl-result-unit"
                  class="unit"></span>
          </output>
        </div>
      </div>
    </form>
  </main>
  <script src="pool-api.js"></script>
  <script src="rpdx.js"></script>
</body>
</html>
